<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bahrain Drive — Demo</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
#title{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;font-weight:800;font-size:20px;text-shadow:0 2px 5px #000}
#stats{position:absolute;top:max(18px,env(safe-area-inset-top));right:18px;text-align:right;font-size:14px;text-shadow:0 2px 5px #000;line-height:1.7}
#hint{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);background:#0008;padding:8px 13px;border-radius:14px;font-size:12px}
#controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));height:120px;pointer-events:none}
.pad{position:absolute;bottom:8px;display:flex;gap:10px;pointer-events:auto}
#steer{left:18px} #pedals{right:18px}
button{width:58px;height:58px;border:1px solid #ffffff55;border-radius:18px;background:#ffffff20;color:white;font-size:26px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none}
button:active{background:#ffffff45;transform:scale(.96)}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07101acc,#000b);z-index:5}
.card{width:min(88vw,420px);padding:28px;border:1px solid #ffffff22;border-radius:26px;background:#10151ddd;color:#fff;text-align:center;box-shadow:0 20px 70px #0008}
.card h1{font-size:34px;margin:0 0 5px}.card p{color:#cbd2da;margin:6px 0 20px}
#start{width:100%;height:58px;background:#fff;color:#111;border:0;font-size:18px;border-radius:16px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#fff;z-index:10}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="loading">جاري تجهيز المدينة…</div>
<div id="game"></div>
<div id="hud">
  <div id="title">BAHRAIN DRIVE</div>
  <div id="stats">السرعة: <b id="speed">0</b> كم/س<br>النقاط: <b id="score">0</b></div>
  <div id="hint">اسحب/اضغط الأزرار للقيادة</div>
  <div id="controls">
    <div class="pad" id="steer">
      <button id="left">‹</button><button id="right">›</button>
    </div>
    <div class="pad" id="pedals">
      <button id="brake">■</button><button id="gas">▲</button>
    </div>
  </div>
</div>
<div id="menu">
  <div class="card">
    <h1>🏁 Bahrain Drive</h1>
    <p>نسخة تجريبية — قيادة حرة 3D</p>
    <p>قد السيارة في المدينة واجمع النقاط.</p>
    <button id="start">ابدأ القيادة</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
(() => {
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fc7ee);
scene.fog=new THREE.Fog(0x8fc7ee,70,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff,0x56604c,1.7));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(60,100,40); sun.castShadow=true; scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
const dark=mat(0x17191c);

function box(x,y,z,c,px,py,pz){
  const m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));
  m.position.set(px,py,pz); m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
box(260,.2,260,0x7b9368,0,-.15,0);

for(let i=-100;i<=100;i+=40){
  box(16,.25,240,0x292c30,i,.02,0);
  box(240,.25,16,0x292c30,0,.03,i);
}
for(let i=-100;i<=100;i+=40){
  for(let j=-100;j<=100;j+=40){
    box(19,.28,19,0xb9b5aa,i,.03,j);
    if(((i/40+j/40)&1)===0){
      const h=8+Math.abs((i*j)%18);
      box(15,h,15,[0xd9d0c2,0xc8d2d9,0xe0c7a9,0xbfc8b7][Math.abs(i+j)%4],i,h/2,j);
      for(let w=-4;w<=4;w+=4) for(let z=-4;z<=4;z+=4) box(1.5,1.4,.12,0x9fd0df,i+w,h*.55,j+7.56);
    }
  }
}
for(let i=-100;i<=100;i+=40){
  for(let k=-110;k<110;k+=12) box(.35,.03,6,0xe9e2b5,i,.18,k);
  for(let k=-110;k<110;k+=12) box(6,.03,.35,0xe9e2b5,k,.19,i);
}
function lamp(x,z){
  box(.25,5,.25,dark,x,2.5,z);
  const l=new THREE.PointLight(0xffe5a0,0.5,14);l.position.set(x,5,z);scene.add(l);
}
for(let x=-100;x<=100;x+=40) for(let z=-100;z<=100;z+=40){lamp(x+9,z+9);}

const car=new THREE.Group(); scene.add(car); car.position.set(0,1,70);
const body=box(3.2,.9,6,0xd92828,0,0,0); body.position.set(0,0,0); car.add(body);
const cabin=box(2.5,1.05,2.7,0x1a2530,0,.85,.25); car.add(cabin);
for(const x of [-1.62,1.62]) for(const z of [-2,2]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.35,18),dark);
  w.rotation.z=Math.PI/2; w.position.set(x,-.25,z);w.castShadow=true;car.add(w);
}
box(.8,.25,.1,0xfff3c2,-.85,.05,-3.02).position.y=.05;
box(.8,.25,.1,0xfff3c2,.85,.05,-3.02).position.y=.05;

const coins=[];
for(let n=0;n<18;n++){
 const a=new THREE.Mesh(new THREE.TorusGeometry(.65,.18,10,20),mat(0xffc928));
 a.position.set((Math.random()*200-100),1.1,(Math.random()*200-100));
 a.rotation.x=Math.PI/2;scene.add(a);coins.push(a);
}

const keys={left:false,right:false,gas:false,brake:false};
function bind(id,key){
 const b=document.getElementById(id);
 ["pointerdown","touchstart"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=true},{passive:false}));
 ["pointerup","pointercancel","pointerleave","touchend"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=false},{passive:false}));
}
bind("left","left");bind("right","right");bind("gas","gas");bind("brake","brake");

let speed=0,score=0,started=false,last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(started){
   if(keys.gas) speed+=18*dt;
   else speed-=7*dt;
   if(keys.brake) speed-=30*dt;
   speed=Math.max(0,Math.min(speed,55));
   const turn=(keys.left?-1:0)+(keys.right?1:0);
   car.rotation.y += turn*speed*.018*dt;
   car.translateZ(-speed*dt*.18);
   car.position.x=Math.max(-118,Math.min(118,car.position.x));
   car.position.z=Math.max(-118,Math.min(118,car.position.z));
   camera.position.lerp(new THREE.Vector3(car.position.x,car.position.y+5.2,car.position.z+10).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y),.09);
   camera.lookAt(car.position.x,car.position.y+1,car.position.z);
   document.getElementById("speed").textContent=Math.round(speed*3.6);
   for(const c of coins){c.rotation.z+=dt*2;if(c.visible&&c.position.distanceTo(car.position)<2.2){c.visible=false;score+=100;document.getElementById("score").textContent=score;}}
 }
 renderer.render(scene,camera);
}
camera.position.set(0,6,82);camera.lookAt(0,1,70);
animate(performance.now());

// إزالة شاشة التحميل فوراً عند جاهزية الصفحة
window.addEventListener('load', () => {
  document.getElementById("loading").classList.add("hidden");
});

document.getElementById("start").onclick=()=>{
  started=true;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("hint").style.opacity=.8;
};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
