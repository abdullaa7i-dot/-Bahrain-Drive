<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bahrain Drive — Ultimate Edition</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;z-index:2}
#title{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;font-weight:800;font-size:20px;text-shadow:0 2px 5px #000}
#stats{position:absolute;top:max(18px,env(safe-area-inset-top));right:18px;text-align:right;font-size:14px;text-shadow:0 2px 5px #000;line-height:1.7}
#controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));height:130px;pointer-events:none}
.pad{position:absolute;bottom:8px;display:flex;gap:10px;pointer-events:auto}
#steer-buttons{left:18px} #pedals{right:18px} #action-pad{left:50%;transform:translateX(-50%)}
button{width:58px;height:58px;border:1px solid #ffffff55;border-radius:18px;background:#ffffff20;color:white;font-size:22px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;display:flex;align-items:center;justify-content:center}
button:active{background:#ffffff45;transform:scale(.96)}
#exit-btn{width:auto;padding:0 16px;font-size:14px;height:50px}
#menu,#settings-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07101acc,#000b);z-index:5}
.card{width:min(88vw,420px);padding:24px;border:1px solid #ffffff22;border-radius:26px;background:#10151ddd;color:#fff;text-align:center;box-shadow:0 20px 70px #0008}
.card h1{font-size:28px;margin:0 0 5px}.card p{color:#cbd2da;margin:6px 0 15px;font-size:14px}
.btn-primary{width:100%;height:52px;background:#fff;color:#111;border:0;font-size:16px;font-weight:bold;border-radius:16px;cursor:pointer;margin-top:10px}
#settings-btn{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:auto;width:40px;height:40px;font-size:16px;border-radius:12px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin:15px 0;font-size:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#fff;z-index:10}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="loading">جاري تحضير المحرك وتجهيز السيارة…</div>
<div id="game"></div>

<div id="hud">
  <div id="title">BAHRAIN DRIVE</div>
  <div id="stats">السرعة: <b id="speed">0</b> كم/س<br>النقاط: <b id="score">0</b></div>
  <button id="settings-btn">⚙️</button>
  
  <div id="controls">
    <div class="pad" id="steer-buttons">
      <button id="left">‹</button><button id="right">›</button>
    </div>
    <div class="pad" id="action-pad">
      <button id="exit-btn">👤 دخول / خروج</button>
    </div>
    <div class="pad" id="pedals">
      <button id="brake">■</button><button id="gas">▲</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="card">
    <h1>🏁 Bahrain Drive</h1>
    <p>الإصدار الشامل — محاكاة 3D تفاعلية</p>
    <button class="btn-primary" id="start">انطلق الآن 🚀</button>
  </div>
</div>

<div id="settings-modal" class="hidden">
  <div class="card">
    <h2>⚙️ الإعدادات</h2>
    <div class="setting-row">
      <span>مستوى صوت المحرك:</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
    </div>
    <button class="btn-primary" id="close-settings">إغلاق</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
(() => {
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc7ee);
scene.fog = new THREE.Fog(0x8fc7ee, 50, 200);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff, 0x56604c, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(50, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
scene.add(sun);

const materials = {};
function getMat(color, emissive = 0x000000) {
  const key = color + '_' + emissive;
  if (!materials[key]) {
    materials[key] = new THREE.MeshLambertMaterial({ color: color, emissive: emissive });
  }
  return materials[key];
}

function box(x, y, z, color, px, py, pz, castShadow = true, emissive = 0x000000) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x, y, z), getMat(color, emissive));
  m.position.set(px, py, pz);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// أرضية وشوارع وأشجار
box(300, 0.2, 300, 0x557a46, 0, -0.15, 0, false);
for (let i = -120; i <= 120; i += 40) {
  box(18, 0.25, 300, 0x22252a, i, 0.02, 0, false);
  box(300, 0.25, 18, 0x22252a, 0, 0.03, i, false);
}

const bColors = [0xd9d0c2, 0xc8d2d9, 0xe0c7a9, 0xbfc8b7];
const leafGeo = new THREE.ConeGeometry(2, 4, 5);
const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 6);
const leafMat = getMat(0x2d6a4f);
const trunkMat = getMat(0x4a3b32);

for (let i = -120; i <= 120; i += 40) {
  for (let j = -120; j <= 120; j += 40) {
    box(19, 0.28, 19, 0xb9b5aa, i, 0.03, j, false);
    if (((i / 40 + j / 40) & 1) === 0) {
      const h = 8 + Math.abs((i * j) % 18);
      box(15, h, 15, bColors[Math.abs(i + j) % 4], i, h / 2, j);
    } else {
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.set(i + 4, 1, j + 4);
      const leaves = new THREE.Mesh(leafGeo, leafMat);
      leaves.position.set(i + 4, 3.5, j + 4);
      scene.add(trunk); scene.add(leaves);
    }
  }
}

// --- تصميم السيارة التفصيلي ---
const car = new THREE.Group();
scene.add(car);
car.position.set(0, 0.5, 70);

// الهيكل والكبينة
const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 6), getMat(0xd92828));
bodyMesh.castShadow = true;
car.add(bodyMesh);

const cabinMesh = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.05, 2.7), getMat(0x1a2530));
cabinMesh.position.set(0, 0.85, 0.25);
cabinMesh.castShadow = true;
car.add(cabinMesh);

// المرايا الجانبية
for (const x of [-1.7, 1.7]) {
  const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.4), getMat(0xd92828));
  mirror.position.set(x, 0.5, -0.5);
  car.add(mirror);
}

// الكشافات الأمامية (مضيئة)
for (const x of [-1.1, 1.1]) {
  const headlight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.1), getMat(0xffffff, 0xffffaa));
  headlight.position.set(x, 0.1, -3.01);
  car.add(headlight);
}

// الإضاءة الخلفية (حمراء مضيئة)
for (const x of [-1.1, 1.1]) {
  const taillight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.1), getMat(0xcc0000, 0xff0000));
  taillight.position.set(x, 0.1, 3.01);
  car.add(taillight);
}

// العجلات
const wheelGeo = new THREE.CylinderGeometry(0.48, 0.48, 0.35, 12);
const darkMat = getMat(0x17191c);
for (const x of [-1.62, 1.62]) {
  for (const z of [-2, 2]) {
    const w = new THREE.Mesh(wheelGeo, darkMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, -0.25, z);
    car.add(w);
  }
}

// مجسم الشخصية (السائق)
const player = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4, 8), getMat(0x0077b6));
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), getMat(0xffdbac));
pHead.position.y = 1;
player.add(pBody); player.add(pHead);
player.position.set(0, 0.7, 70);
player.visible = false;
scene.add(player);

let inCar = true;

// صوت المحرك البرمجي (V8 Engine)
let audioCtx, osc, gainNode;
let maxVolume = 0.5;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(40, audioCtx.currentTime);
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.start();
}

function updateEngineSound(currentSpeed, isAccelerating) {
  if (!audioCtx || !inCar) return;
  const targetFreq = 40 + (currentSpeed * 2.5) + (isAccelerating ? 15 : 0);
  const targetVol = isAccelerating ? maxVolume : Math.min(maxVolume * 0.3, currentSpeed * 0.01);
  osc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
  gainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
}

// العملات
const coins = [];
const coinGeo = new THREE.TorusGeometry(0.65, 0.18, 8, 12);
const coinMat = getMat(0xffc928);
for (let n = 0; n < 20; n++) {
  const a = new THREE.Mesh(coinGeo, coinMat);
  a.position.set(Math.random() * 200 - 100, 1.1, Math.random() * 200 - 100);
  a.rotation.x = Math.PI / 2;
  scene.add(a);
  coins.push(a);
}

// مدخلات التحكم
const keys = { left: false, right: false, gas: false, brake: false };
function bind(id, key) {
  const b = document.getElementById(id);
  ["pointerdown", "touchstart"].forEach(ev => b.addEventListener(ev, e => { e.preventDefault(); keys[key] = true; initAudio(); }, { passive: false }));
  ["pointerup", "pointercancel", "touchend"].forEach(ev => b.addEventListener(ev, e => { e.preventDefault(); keys[key] = false; }, { passive: false }));
}
bind("left", "left"); bind("right", "right"); bind("gas", "gas"); bind("brake", "brake");

document.getElementById("exit-btn").onclick = () => {
  inCar = !inCar;
  if (!inCar) {
    player.position.set(car.position.x + 2.5, 0.7, car.position.z);
    player.visible = true;
    if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
  } else {
    player.visible = false;
  }
};

let speed = 0, score = 0, started = false, last = performance.now();
const speedEl = document.getElementById("speed");
const scoreEl = document.getElementById("score");
const camOffset = new THREE.Vector3(0, 5.2, 10);

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;

  if (started) {
    if (inCar) {
      if (keys.gas) speed += 22 * dt;
      else speed -= 8 * dt;
      if (keys.brake) speed -= 35 * dt;

      speed = Math.max(0, Math.min(speed, 55));
      const turn = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
      car.rotation.y += turn * (speed > 5 ? 1 : speed / 5) * 1.2 * dt;
      car.translateZ(-speed * dt * 0.5);

      car.position.x = Math.max(-135, Math.min(135, car.position.x));
      car.position.z = Math.max(-135, Math.min(135, car.position.z));

      const targetCamPos = camOffset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y).add(car.position);
      camera.position.lerp(targetCamPos, 0.1);
      camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

      speedEl.textContent = Math.round(speed * 3.6);
      updateEngineSound(speed, keys.gas);
    } else {
      speed = 0;
      speedEl.textContent = "0";
      const moveSpeed = 8 * dt;
      if (keys.gas) player.translateZ(-moveSpeed);
      if (keys.brake) player.translateZ(moveSpeed);
      if (keys.left) player.rotation.y += 2.5 * dt;
      if (keys.right) player.rotation.y -= 2.5 * dt;

      camera.position.lerp(new THREE.Vector3(player.position.x, player.position.y + 3, player.position.z + 6), 0.1);
      camera.lookAt(player.position);
    }

    const targetPos = inCar ? car.position : player.position;
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.visible) {
        c.rotation.z += dt * 3;
        if (c.position.distanceToSquared(targetPos) < 6.2) {
          c.visible = false;
          score += 100;
          scoreEl.textContent = score;
        }
      }
    }
  }
  renderer.render(scene, camera);
}

document.getElementById("start").onclick = () => {
  started = true;
  initAudio();
  document.getElementById("menu").classList.add("hidden");
};

window.addEventListener('load', () => {
  document.getElementById("loading").classList.add("hidden");
});

document.getElementById("settings-btn").onclick = () => document.getElementById("settings-modal").classList.remove("hidden");
document.getElementById("close-settings").onclick = () => document.getElementById("settings-modal").classList.add("hidden");
document.getElementById("volume-slider").oninput = (e) => { maxVolume = parseFloat(e.target.value); };

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate(performance.now());
})();
</script>
</body>
</html>
